server.address=127.0.0.1
server.port=${CHAT_PORT:8087}
chat.workspace=${CHAT_WORKSPACE:${user.home}/.agentscope/session-chat}
chat.baseUrl=${BASE_URL:}
chat.model=${CHAT_MODEL:demo}
chat.api-key=${DASHSCOPE_API_KEY:}
spring.main.banner-mode=off
# Inline Base64 image/video payloads exceed the 256KB default request body buffer.
spring.http.codecs.max-in-memory-size=32MB
# chat.js/chat.css ship together with index.html; revalidate so a new page never pairs with stale assets.
spring.web.resources.cache.cachecontrol.no-cache=true
